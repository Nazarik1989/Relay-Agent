<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
  <title id="title">Relay to NAZ to Story and Reels workflow</title>
  <desc id="description">Relay collects selected work evidence, sanitizes it, writes project-scoped Markdown to the NAZ Content Inbox, and NAZ chooses a standard draft or an approval-gated Story and Reels route.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12304a" stroke-width="1" opacity="0.28" />
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55dcff" />
    </marker>
    <style>
      .title { font: 700 35px "Segoe UI", Arial, sans-serif; fill: #f4faff; }
      .label { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #f4faff; }
      .sub { font: 21px "Segoe UI", Arial, sans-serif; fill: #afc7da; }
      .edge { fill: none; stroke: #55dcff; stroke-width: 5; marker-end: url(#arrow); }
      .node { fill: #091522; stroke: #aee6ff; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1200" height="1500" rx="30" fill="#050b13" />
  <rect width="1200" height="1500" rx="30" fill="url(#grid)" />
  <text x="600" y="64" text-anchor="middle" class="title">RELAY → NAZ → STORY / REELS</text>

  <path class="edge" d="M 460 210 L 460 270" />
  <path d="M 760 155 H 830" fill="none" stroke="#718399" stroke-width="4" stroke-dasharray="12 10" />
  <path class="edge" d="M 600 380 V 440" />
  <path class="edge" d="M 600 550 V 610" />
  <path class="edge" d="M 600 720 V 780" />
  <path class="edge" d="M 600 890 V 950" />
  <path class="edge" d="M 600 1060 V 1120" />
  <path d="M 600 1230 V 1280 H 320 V 1320" class="edge" />
  <path d="M 600 1280 H 880 V 1320" class="edge" />

  <rect class="node" x="160" y="100" width="600" height="110" rx="28" />
  <text x="460" y="145" text-anchor="middle" class="label">CODEX WORK SESSIONS</text>
  <text x="460" y="180" text-anchor="middle" class="sub">selected local history and logs</text>

  <path d="M 830 105 H 1120 L 1160 145 V 215 H 830 Z" fill="#091522" stroke="#718399" stroke-width="4" />
  <path d="M 1120 105 V 145 H 1160" fill="none" stroke="#718399" stroke-width="4" />
  <text x="995" y="154" text-anchor="middle" class="label" font-size="24">RAW LOGS</text>
  <text x="995" y="186" text-anchor="middle" class="sub">stay local</text>

  <rect class="node" x="260" y="270" width="680" height="110" rx="28" />
  <text x="600" y="315" text-anchor="middle" class="label">LOCAL COLLECTOR</text>
  <text x="600" y="350" text-anchor="middle" class="sub">select relevant activity</text>

  <rect class="node" x="260" y="440" width="680" height="110" rx="28" />
  <text x="600" y="485" text-anchor="middle" class="label">SANITIZER</text>
  <text x="600" y="520" text-anchor="middle" class="sub">remove secrets and private data</text>

  <rect class="node" x="260" y="610" width="680" height="110" rx="28" />
  <text x="600" y="655" text-anchor="middle" class="label">INSIGHT EXTRACTOR</text>
  <text x="600" y="690" text-anchor="middle" class="sub">changes · decisions · verified results</text>

  <rect class="node" x="260" y="780" width="680" height="110" rx="28" />
  <text x="600" y="825" text-anchor="middle" class="label">PROJECT / DATE / TOPIC</text>
  <text x="600" y="860" text-anchor="middle" class="sub">evidence-backed Markdown story</text>

  <rect class="node" x="260" y="950" width="680" height="110" rx="28" stroke="#00e5ff" filter="url(#glow)" />
  <text x="600" y="995" text-anchor="middle" class="label">NAZ CONTENT INBOX</text>
  <text x="600" y="1030" text-anchor="middle" class="sub">project-first intake · second privacy scan</text>

  <rect class="node" x="260" y="1120" width="680" height="110" rx="28" stroke="#a88cff" />
  <text x="600" y="1165" text-anchor="middle" class="label">EDITORIAL ORCHESTRATOR</text>
  <text x="600" y="1200" text-anchor="middle" class="sub">deterministic standard / story_first decision</text>

  <rect class="node" x="80" y="1320" width="480" height="110" rx="28" stroke="#52b8ff" />
  <text x="320" y="1365" text-anchor="middle" class="label">STANDARD DRAFT</text>
  <text x="320" y="1400" text-anchor="middle" class="sub">versioned preview</text>

  <rect class="node" x="640" y="1320" width="480" height="110" rx="28" stroke="#be69ff" />
  <text x="880" y="1365" text-anchor="middle" class="label">STORY / REELS</text>
  <text x="880" y="1400" text-anchor="middle" class="sub">explicit admin approval</text>

  <text x="600" y="1470" text-anchor="middle" class="sub">No paid rendering before confirmation · completed media stays private</text>
</svg>
